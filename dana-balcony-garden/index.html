<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גינת מרפסת דנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.vlab{font-size:.84rem;color:var(--muted);align-self:center;padding:0 4px}
#varSel{max-width:70vw}
.cmp{margin:14px 0 22px}
.cmp button{margin-bottom:4px}
.cmp .note{margin:.2rem 0 .5rem}
:root{
  --sky:#e9ecea; --ink:#1f2a24; --muted:#5b6a61;
  --panel:rgba(255,255,255,.88); --line:rgba(31,42,36,.16);
  --leaf:#2f6b3a; --leaf-ink:#ffffff; --off:#eef1ee; --warn:#8a5a00; --warnbg:#fff4df;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky:#161d1b; --ink:#e7efe9; --muted:#9fb0a6;
    --panel:rgba(26,34,31,.88); --line:rgba(231,239,233,.18);
    --leaf:#6fbf7d; --leaf-ink:#0f1a13; --off:#222b27; --warn:#f0c46b; --warnbg:#3a3020;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:"Heebo","Arial Hebrew","Arial",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.head{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;left:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.title{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);pointer-events:auto;max-width:min(72vw,440px)}
.title h1{font-size:1.05rem;line-height:1.25;margin:0;font-weight:700}
.title p{margin:.2rem 0 0;font-size:.82rem;color:var(--muted);line-height:1.4}
.views{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.dock{position:fixed;right:14px;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:2}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;backdrop-filter:blur(8px);pointer-events:auto;max-width:100%}
.sep{width:1px;background:var(--line);margin:2px 2px}
button,select{font:inherit;color:var(--ink);background:var(--off);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.86rem;cursor:pointer;min-height:36px}
button[aria-pressed="true"],.views button[aria-selected="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:transparent;font-weight:500}
button:focus-visible,select:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.views button{background:var(--panel);backdrop-filter:blur(8px)}
.hint{font-size:.78rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;pointer-events:none;text-align:center}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:1rem;line-height:1.6}
.pane{position:fixed;inset:0;overflow:auto;background:var(--sky);padding:calc(env(safe-area-inset-top,0px) + 84px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:2}
.pane[hidden]{display:none}
.sheetbox{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.sheetbox.wide{max-width:1400px}
.sheetbox h2{font-size:1.1rem;margin:0 0 .2rem}
.sheetbox h3{font-size:.98rem;margin:1.1rem 0 .4rem}
.note{color:var(--muted);font-size:.85rem;margin:0 0 .8rem;line-height:1.5}
.svgwrap{overflow-x:auto;background:#fff;border-radius:8px}
.svgwrap svg{display:block;min-width:760px;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;line-height:1.45}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
thead th{background:var(--off);font-weight:500}
td.n{white-space:nowrap;width:1%}
tfoot td{font-weight:700;background:var(--off)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--off);border:1px solid var(--line);color:var(--muted);margin-inline-start:4px}
.warn{color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 12px;font-size:.85rem;line-height:1.55}
ul.as{margin:.3rem 0;padding-inline-start:1.2rem;font-size:.88rem;line-height:1.65}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pick label{font-size:.85rem;color:var(--muted)}
.pick select{width:100%;border-radius:10px;margin-top:3px}
.pick{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pk{border:1px solid #dfe5dc;border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.pk b{font-size:.9rem;font-weight:600}
.slotH{width:100%;margin:6px 0 2px;font-size:.85rem;font-weight:600}
body.paneOpen .dock{display:none}
body.paneOpen .title{visibility:hidden}
#sheet{position:fixed;right:14px;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px);max-width:560px;margin:0 auto}
#sheet[hidden]{display:none}
#sheet h4{margin:0 0 .15rem;font-size:1rem}
#sheet p{margin:0 0 .5rem;color:var(--muted);font-size:.84rem;line-height:1.5}
#sheet .opts{display:flex;flex-wrap:wrap;gap:6px}
#sheet .close{position:absolute;left:10px;top:8px;min-height:30px;padding:3px 10px}
body.sheetOpen .dock{display:none}
#sheet .hidebtn{background:var(--warnbg);color:var(--warn);border-color:var(--warn);font-weight:500}
#hiddenBtn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
@media (max-width:560px){ .title p{display:none} .title h1{font-size:.95rem} button{padding:6px 10px;font-size:.8rem;min-height:34px} }
</style>
</head>
<body>
<div id="stage" aria-label="מודל תלת־ממד של המרפסת. גוררים כדי לסובב"></div>

<div class="head">
  <div class="title">
    <h1>גינת מרפסת דנה</h1>
    <p>890 × 145, תקרה 274. 7 אדניות 53×30×25, 7 עציצים תלויים, מטפס על הבלוקים. ארונית 100×30×170 ומזגן בקיר המערבי.</p>
  </div>
</div>

<div class="dock">
  <div class="chips" id="varchips" style="display:none"><label for="varSel" class="vlab">הצעה</label><select id="varSel"></select></div>
  <div class="chips" id="camchips">
    <button type="button" data-tog="dims" aria-pressed="true">מידות</button>
    <button type="button" data-tog="cab" aria-pressed="true">ארונית</button>
    <button type="button" data-tog="cabopen" aria-pressed="false">ארונית פתוחה</button>
  </div>
  <div class="hint" id="hint">גוררים כדי לסובב · שתי אצבעות להתקרב</div>
</div>

<div id="sheet" hidden role="dialog" aria-label="בחירת צמח לאדנית">
  <button type="button" class="close" id="sheetClose" aria-label="סגירה">✕</button>
  <h4 id="sheetTitle"></h4>
  <p id="sheetText"></p>
  <div class="opts" id="sheetOpts"></div>
</div>



<div class="fail" id="fail">המודל לא נטען כי לא הייתה גישה לספריית התלת־ממד. השרטוט והרשימה עדיין זמינים בלשוניות למעלה.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- shared data ----------
var LEN=890, W=145, H=274, SILL=127, T=20;
var SEG=[{t:'wall',w:200},{t:'win',w:158},{t:'pillar',w:31},{t:'win',w:154},{t:'wall',w:194},{t:'win',w:153}];
(function(){ var x=0; SEG.forEach(function(s){ s.x0=x; s.x1=x+s.w; x+=s.w; }); })();
var NAMES={win:'פתח',wall:'קיר',pillar:'עמוד'};
var HANG=[{x:50,p:'zygo',c:0x8b9a7a},{x:100,p:'hoya',c:0xc29a6a},{x:150,p:'zygo',c:0x8b9a7a},
          {x:373.5,p:'hoya',c:0xc29a6a},
          {x:591.5,p:'zygo',c:0x8b9a7a},{x:640,p:'hoya',c:0xc29a6a},{x:688.5,p:'zygo',c:0x8b9a7a}];
var POT_BOTTOM=220, POT_H=20, POT_R=12.5, HOOK_Y=262, POT_Z=W-18;
var PL_L=53, PL_D=30, PL_H=25, PL_Z0=W-2-PL_D;
var WOMAN={x:529,z:62,h:170};
var CAB={x0:579,l:100,d:30,h:170}; // cabinet on the west wall, on the woman's left (toward the window-153 end), as tall as she is
// AC outdoor unit on the floor in the corner of the window-153 end and the west wall: back to that end (x=890, 10 off it), fan facing into the balcony (-x). w runs along the end (z), d along the balcony (x)
var ACU={x0:850,z0:5,w:80,d:30,h:55};
var EVEN9=[10,112.1,214.3,316.4,418.5,520.6,622.8,724.9,827], EVEN7=[10,146.2,282.3,418.5,554.7,690.8,827];
var VARIANTS=[
 {n:'שלושה סוגים', x:[23.5,123.5,252.5,439.5,565,662,787], p:['chamae','spath','trach','trach','spath','chamae','trach'], d:'מטפס בפתחים. בכל קיר זוג: צמח גבוה בצד החיצוני וצמח נמוך פורח בצד הפנימי – תמונת ראי בין שני הקירות.'}
];
var PLANTERS;
function LEN_OF(i){ return VARIANTS[i].L||53; }
function PER(L){ return 1; }
function norm(c){ return [Array.isArray(c)?c[0]:c]; }
function combo(c){ return SHORT[norm(c)[0]]; }
var FLOOR={
  chamae:{n:'חמדוריאה אלגנס',s:9,price:null,src:'',size:'עציץ 18',why:'דקל של צל, עולה מעל הבלוקים אל תוך הפתח'},
  spath:{n:'ספאתיפילום',s:9,price:null,src:'',size:'עציץ 17',why:'פריחה לבנה בצל מואר'},
  zamia:{n:'זמיקולקס',s:9,price:null,src:'',size:'עציץ 18',why:'הכי עמיד, כמעט בלי טיפול'},
  fern:{n:'שרך בוסטון',s:9,price:null,src:'',size:'עציץ 15',why:'נשפך מעל דופן האדנית'},
  pseud:{n:'פסאודרנתמום',s:7,price:null,src:'',size:'',why:'עלווה מגוונת; דוהה מעט בצל'},
  cordy:{n:'קורדילין טנגו',s:6,price:null,src:'',size:'4 ליטר',why:'צבע בורדו – נחלש בצל'},
  trach:{n:'יסמין כוכבים (טרכלוספרמון)',s:7,price:null,src:'',size:'',why:'מטפס על הבלוקים ונכנס לחורים; פריחה לבנה ריחנית, פחות פרחים בחצי צל',climb:1},
  taberna:{n:'טברנה מונטנה',s:6,price:null,src:'',size:'10 ליטר',why:'שיח עם פרחים לבנים ריחניים; בצל מואר פורח פחות. מוהל חלבי – להרחיק מחיות'},
  dieff:{n:'דיפנבכיה טרופיק',s:7,price:null,src:'',size:'עציץ 18',why:'עלים גדולים לבן־ירוק; רגישה לקור ולרוח, רעילה'},
  stephan:{n:'סטפנוטיס',s:4,price:null,src:'',size:'7 ליטר',why:'דומה ליסמין ומטפס, אבל צריך יותר אור כדי לפרוח',climb:1}
};
var SHORT={chamae:'חמדוריאה',spath:'ספאתיפילום',zamia:'זמיה',fern:'שרך',pseud:'פסאודרנתמום',cordy:'קורדילין',trach:'יסמין',stephan:'סטפנוטיס',taberna:'טברנה',dieff:'דיפנבכיה'};
var store={v:1,c:{}};
var NONAMES=true;
var EDITOR=false; // full (costs) version; the client build sets this to false
try{ var sv=JSON.parse(null||'null'); if(sv && typeof sv.v==='number' && sv.c) store=sv; }catch(e){}

function variantChoice(i){ var c=store.c[i], d=VARIANTS[i].p; var ok=c && c.length===d.length && c.every(function(x){ return norm(x).every(function(k){return FLOOR[k];}); }); return (ok?c:d).map(norm); }
var V=Math.max(0,Math.min(store.v,VARIANTS.length-1)); PLANTERS=VARIANTS[V].x; PL_L=LEN_OF(V); PL_H=VARIANTS[V].H||25; var choice=variantChoice(V);
function saveChoice(){ store.v=V; store.c[V]=choice.map(function(c){return c.slice();}); try{  }catch(e){} }
var onVariant=null;
function setVariant(i){ V=i; PLANTERS=VARIANTS[i].x; PL_L=LEN_OF(i); PL_H=VARIANTS[i].H||25; choice=variantChoice(i); saveChoice(); closeSheet(); renderBOM(); drawSVG(); var sel=document.getElementById('varSel'); if(sel) sel.value=String(i); if(onVariant) onVariant(); }

// ---------- tabs ----------
(function(){
  var tabs=document.querySelectorAll('.views [role=tab]');
  tabs.forEach(function(b){ b.addEventListener('click',function(){
    tabs.forEach(function(t){ t.setAttribute('aria-selected', t===b?'true':'false'); });
    var k=b.dataset.tab;
    document.getElementById('pane-draw').hidden = k!=='draw';
    document.getElementById('pane-list').hidden = k!=='list';
    document.body.classList.toggle('paneOpen', k!=='model');
    if(k!=='model') closeSheet();
  }); });
})();

function renderBOM(){}
var onChoice=null;
function where(i){ var c=PLANTERS[i]+PL_L/2; var sg=SEG.filter(function(s){return c>=s.x0&&c<s.x1;})[0]; return (sg.t==='win'?'מתחת לפתח ':'מתחת לקיר ')+sg.w; }
function setChoice(i,slot,k){ choice[i][slot]=k; saveChoice(); renderBOM(); drawSVG(); if(onChoice) onChoice(i); }

function drawSVG(){}

// ---------- sheet ----------
var sheet=document.getElementById('sheet');
function closeSheet(){ sheet.hidden=true; document.body.classList.remove('sheetOpen'); if(window.__hl) window.__hl(-1); }
document.getElementById('sheetClose').addEventListener('click',closeSheet);
function openPlanter(i){
  document.getElementById('sheetTitle').textContent='אדנית '+(i+1)+' · '+where(i)+' · '+PL_L+'×'+PL_D+'×'+PL_H;
  var c=choice[i];
  document.getElementById('sheetText').textContent='כרגע: '+FLOOR[c[0]].n+' – '+FLOOR[c[0]].why+'. בוחרים צמח:';
  var box=document.getElementById('sheetOpts'); box.innerHTML='';
  c.forEach(function(cur,slot){
    
    Object.keys(FLOOR).forEach(function(k){
      var b=document.createElement('button'); b.type='button'; b.textContent=SHORT[k]+' · '+FLOOR[k].s+'/10';
      b.setAttribute('aria-pressed', k===cur?'true':'false');
      b.addEventListener('click',function(){ setChoice(i,slot,k); openPlanter(i); });
      box.appendChild(b);
    });
  });
  addHideBtn('p'+i);
  sheet.hidden=false; document.body.classList.add('sheetOpen'); if(window.__hl) window.__hl(i);
}
function openHang(h){
  var z=h.p==='zygo';
  document.getElementById('sheetTitle').textContent=(z?'זיגוקקטוס':'בת שבע (הויה)')+' · עציץ תלוי';
  document.getElementById('sheetText').textContent=(z?'קערה 15. 9/10 למרפסת. ':'כ־6/10 (הערכה): תגדל, הפריחה לא בטוחה באור צדדי. ')+'עציץ דמוי ראטן Ø25, עומק 20. תחתית ב־220.';
  document.getElementById('sheetOpts').innerHTML='';
  addHideBtn('h'+HANG.indexOf(h));
  sheet.hidden=false; document.body.classList.add('sheetOpen');
}
// ---------- hide / restore (costs version only) ----------
function addHideBtn(id){
  if(!EDITOR || !window.__hide) return;
  var b=document.createElement('button'); b.type='button'; b.textContent='הסתרה'; b.className='hidebtn';
  b.addEventListener('click',function(){ window.__hide(id); closeSheet(); });
  var box=document.getElementById('sheetOpts'); box.insertBefore(b,box.firstChild);
}
var ITEM_TEXT={cab:'100 × 30, גובה 170. על הקיר המערבי.', ac:'מנוע מזגן 80 × 30, גובה 55. על הרצפה בפינה עם הקיר המערבי.', woman:'דמות בגובה 170, לקנה מידה.'};
function openItem(id){
  var names={cab:'ארונית',ac:'מזגן',woman:'הדמות'};
  document.getElementById('sheetTitle').textContent=names[id]||id;
  document.getElementById('sheetText').textContent=ITEM_TEXT[id]||'';
  var box=document.getElementById('sheetOpts'); box.innerHTML='';
  if(id==='cab'){
    var tg=document.querySelector('[data-tog=cabopen]'), open=tg && tg.getAttribute('aria-pressed')==='true';
    var b=document.createElement('button'); b.type='button'; b.textContent=open?'סגירת הדלתות':'פתיחת הדלתות';
    b.addEventListener('click',function(){ if(tg) tg.click(); openItem('cab'); }); box.appendChild(b);
  }
  addHideBtn(id);
  sheet.hidden=false; document.body.classList.add('sheetOpen');
}
function openHidden(){
  var list=window.__hiddenList?window.__hiddenList():[];
  if(!list.length){ closeSheet(); return; }
  document.getElementById('sheetTitle').textContent='פריטים מוסתרים';
  document.getElementById('sheetText').textContent='לוחצים על פריט כדי להחזיר אותו.';
  var box=document.getElementById('sheetOpts'); box.innerHTML='';
  var all=document.createElement('button'); all.type='button'; all.textContent='החזרת הכל'; all.setAttribute('aria-pressed','true');
  all.addEventListener('click',function(){ list.forEach(function(it){ window.__hide(it.id,false); }); closeSheet(); }); box.appendChild(all);
  list.forEach(function(it){ var b=document.createElement('button'); b.type='button'; b.textContent='↩ '+it.name;
    b.addEventListener('click',function(){ window.__hide(it.id,false); openHidden(); }); box.appendChild(b); });
  sheet.hidden=false; document.body.classList.add('sheetOpen');
}


// ---------- 3D ----------
(function(){
  if(!window.THREE || !THREE.OrbitControls){
    document.getElementById('fail').style.display='flex';
    document.getElementById('hint').style.display='none';
    document.getElementById('camchips').style.display='none';
    return;
  }
  var stage=document.getElementById('stage');
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.appendChild(renderer.domElement);
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--sky').trim()||'#e9ecea');
  var camera=new THREE.PerspectiveCamera(45,1,2,9000);
  var controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=30; controls.maxDistance=3000;

  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f86,0.8));
  var sun=new THREE.DirectionalLight(0xfff4e0,0.6); sun.position.set(300,500,1200); scene.add(sun); // from the east (+z), morning
  var fill=new THREE.DirectionalLight(0xffffff,0.3); fill.position.set(-400,400,-600); scene.add(fill);

  function lam(c,o){ var m=new THREE.MeshLambertMaterial({color:c}); if(o){ for(var k in o) m[k]=o[k]; } return m; }
  var M={
    plaster:lam(0xefe9df), plasterOut:lam(0xe2dbcf), floor:lam(0xd6cfc2), steel:lam(0x3f444a),
    soil:lam(0x4a3626), planter:lam(0xf6f4ee), groove:lam(0xd2ccc0), ceil:lam(0xf3efe7,{transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide})
  };
  // floor tile texture
  (function(){
    var c=document.createElement('canvas'); c.width=c.height=128; var x=c.getContext('2d');
    x.fillStyle='#d9d2c4'; x.fillRect(0,0,128,128); x.strokeStyle='#bdb4a4'; x.lineWidth=2; x.strokeRect(1,1,126,126);
    for(var i=0;i<60;i++){ x.fillStyle='rgba(120,110,95,'+(Math.random()*0.12)+')'; x.fillRect(Math.random()*128,Math.random()*128,2,2); }
    var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(LEN/40,W/40); M.floor=new THREE.MeshLambertMaterial({map:t});
  })();
  // breeze-block texture with real holes (alphaTest)
  function breezeTex(rx,ry){

  // ---------- cabinet on the west wall ----------

    [0,1].forEach(function(k){ var bar=new THREE.Mesh(new THREE.BoxGeometry(k?0.8:2*r,k?2*r:0.8,0.6),grey); bar.position.set(cx,cy,a.d+0.5); g.add(bar); });

  regItem('cab','ארונית',L.cab); regItem('ac','מזגן',L.ac);

  // ---------- dimensions ----------
  function label(text,x,y,z,h,par){
    var c=document.createElement('canvas'), ctx=c.getContext('2d'), fs=44;
    ctx.font='500 '+fs+'px Heebo, Arial, sans-serif'; var tw=ctx.measureText(text).width;
    c.width=Math.ceil(tw+30); c.height=fs+20; ctx.font='500 '+fs+'px Heebo, Arial, sans-serif';
    ctx.fillStyle='rgba(255,255,255,.9)'; var r=12, w=c.width, hh=c.height;
    ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(w-r,0); ctx.quadraticCurveTo(w,0,w,r); ctx.lineTo(w,hh-r); ctx.quadraticCurveTo(w,hh,w-r,hh); ctx.lineTo(r,hh); ctx.quadraticCurveTo(0,hh,0,hh-r); ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0); ctx.fill();
    ctx.fillStyle='#1f2a24'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.direction=/[֐-׿]/.test(text)?'rtl':'ltr'; ctx.fillText(text,w/2,hh/2+2);
    var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter;
    var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true})); var H2=h||9;
    sp.scale.set(H2*c.width/c.height,H2,1); sp.position.set(x,y,z); sp.renderOrder=20; sp.userData.owner=dimOwner; (par||L.dims).add(sp); return sp;
  }
  var dimOwner=null; // the item a dimension belongs to: hidden with it
  var dm=new THREE.LineBasicMaterial({color:0x2b3330,depthTest:false});
  function line(a,b){ var l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),dm); l.renderOrder=19; l.userData.owner=dimOwner; L.dims.add(l); }

    dimOwner='ac';

  var tm=new THREE.LineBasicMaterial({color:0x2f6b3a,depthTest:false}), cm=new THREE.MeshBasicMaterial({color:0x2f6b3a,depthTest:false});
  function arrow(a,b){ var l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),tm); l.renderOrder=19; L.tags.add(l);
    var c=new THREE.Mesh(new THREE.ConeGeometry(1.6,5,10),cm); c.renderOrder=19; c.position.copy(b);

  // ---------- views ----------
  var VIEWS={
    overview:{p:[-200,560,-380],t:[430,90,80],west:false},

  };
  var anim=null;
  function goView(k,instant){
    var v=VIEWS[k]; var p0=camera.position.clone(), t0=controls.target.clone(), p1=new THREE.Vector3().fromArray(v.p), t1=new THREE.Vector3().fromArray(v.t);

    if(instant){ camera.position.copy(p1); controls.target.copy(t1); controls.update(); return; }

  }

    var on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on?'true':'false');
    if(b.dataset.tog==='dims') L.dims.visible=on; if(b.dataset.tog==='ceil') L.ceil.visible=on; if(b.dataset.tog==='west') L.west.visible=on; if(b.dataset.tog==='tags') L.tags.visible=on; if(b.dataset.tog==='woman') L.woman.visible=on; if(b.dataset.tog==='cab') window.__hide('cab',!on); if(b.dataset.tog==='cabopen' && window.__cabOpen){ window.__cabOpen(on); if(on){ window.__hide('cab',false); goView('cab'); } else if(!document.querySelector('[data-view]')) goView('overview'); }
  }); });
  goView('overview',true);

  // ---------- picking ----------
  var ray=new THREE.Raycaster(), ptr=new THREE.Vector2(), down=null;
  renderer.domElement.addEventListener('pointerdown',function(e){ down=[e.clientX,e.clientY]; });
  renderer.domElement.addEventListener('pointerup',function(e){
    if(!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return;
    var r=renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ptr,camera);
    // the client page (EDITOR=false) is an illustration only: tapping a planter or pot does nothing
    var targets=(EDITOR?planterHit.concat(hangHit,acHit,womanHit):[]).concat(cabHit);
    var hit=ray.intersectObjects(targets,false).filter(function(h){ return shown(h.object); })[0];
    if(!hit){ closeSheet(); return; }
    var o=hit.object;
    if(o.userData.cab){
      if(EDITOR) openItem('cab'); else { var cb=document.querySelector('[data-tog=cabopen]'); if(cb) cb.click(); }
      return;

    if(o.userData.planter!=null){ openPlanter(o.userData.planter); return; }
    if(o.userData.hang!=null){ openHang(HANG[o.userData.hang]); return; }
    while(o && !o.userData.itemId) o=o.parent;
    if(o) openItem(o.userData.itemId);
  });

  function resize(){ var w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<h ? 60 : 45; camera.updateProjectionMatrix(); }
  window.addEventListener('resize',resize); resize();
  (function loop(now){ requestAnimationFrame(loop); if(anim) anim(now); window.__cabStep(); controls.update(); renderer.render(scene,camera); })(performance.now());
})();
