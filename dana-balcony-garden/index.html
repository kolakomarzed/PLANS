<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גינת מרפסת דנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.vlab{font-size:.84rem;color:var(--muted);align-self:center;padding:0 4px}
#varSel{max-width:70vw}
.cmp{margin:14px 0 22px}
.cmp button{margin-bottom:4px}
.cmp .note{margin:.2rem 0 .5rem}
.sunbar{flex-direction:column;align-items:stretch;width:min(560px,100%)}
.sunrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sunrow input[type=range]{flex:1;min-width:150px;accent-color:#e0a800}
.sunrow input[type=date]{font:inherit;color:var(--ink);background:var(--off);border:1px solid var(--line);border-radius:999px;padding:5px 10px;min-height:36px}
#sunRead{font-size:.82rem;color:var(--muted);white-space:nowrap}
.lg{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.phero{display:block;width:100%;max-height:60vh;object-fit:cover;border-radius:12px;margin:10px 0 4px;background:var(--off)}
.phero.noimg{height:160px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem}
.pcr{font-size:.72rem;color:var(--muted);margin:0 0 8px}
.infobtn{background:#fff3c4!important;color:#7a4a00!important;border:1px solid #e8c766!important;font-weight:500;font-size:.78rem!important;min-height:28px!important;padding:2px 10px!important}
#plantBody h2{margin:.4rem 0 .2rem}
#plantBody th{width:32%;color:var(--muted);font-weight:500}
:root{
  --sky:#e9ecea; --ink:#1f2a24; --muted:#5b6a61;
  --panel:rgba(255,255,255,.88); --line:rgba(31,42,36,.16);
  --leaf:#2f6b3a; --leaf-ink:#ffffff; --off:#eef1ee; --warn:#8a5a00; --warnbg:#fff4df;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky:#161d1b; --ink:#e7efe9; --muted:#9fb0a6;
    --panel:rgba(26,34,31,.88); --line:rgba(231,239,233,.18);
    --leaf:#6fbf7d; --leaf-ink:#0f1a13; --off:#222b27; --warn:#f0c46b; --warnbg:#3a3020;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:"Heebo","Arial Hebrew","Arial",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.head{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;left:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.title{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);pointer-events:auto;max-width:min(72vw,440px)}
.title h1{font-size:1.05rem;line-height:1.25;margin:0;font-weight:700}
.title p{margin:.2rem 0 0;font-size:.82rem;color:var(--muted);line-height:1.4}
.views{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.dock{position:fixed;right:14px;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:2}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;backdrop-filter:blur(8px);pointer-events:auto;max-width:100%}
.sep{width:1px;background:var(--line);margin:2px 2px}
button,select{font:inherit;color:var(--ink);background:var(--off);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.86rem;cursor:pointer;min-height:36px}
button[aria-pressed="true"],.views button[aria-selected="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:transparent;font-weight:500}
button:focus-visible,select:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.views button{background:var(--panel);backdrop-filter:blur(8px)}
.hint{font-size:.78rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;pointer-events:none;text-align:center}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:1rem;line-height:1.6}
.pane{position:fixed;inset:0;overflow:auto;background:var(--sky);padding:calc(env(safe-area-inset-top,0px) + 84px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:2}
.pane[hidden]{display:none}
.sheetbox{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.sheetbox.wide{max-width:1400px}
.sheetbox h2{font-size:1.1rem;margin:0 0 .2rem}
.sheetbox h3{font-size:.98rem;margin:1.1rem 0 .4rem}
.note{color:var(--muted);font-size:.85rem;margin:0 0 .8rem;line-height:1.5}
.svgwrap{overflow-x:auto;background:#fff;border-radius:8px}
.svgwrap svg{display:block;min-width:760px;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;line-height:1.45}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
thead th{background:var(--off);font-weight:500}
td.n{white-space:nowrap;width:1%}
tfoot td{font-weight:700;background:var(--off)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--off);border:1px solid var(--line);color:var(--muted);margin-inline-start:4px}
.warn{color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 12px;font-size:.85rem;line-height:1.55}
ul.as{margin:.3rem 0;padding-inline-start:1.2rem;font-size:.88rem;line-height:1.65}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pick label{font-size:.85rem;color:var(--muted)}
.pick select{width:100%;border-radius:10px;margin-top:3px}
.pick{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pk{border:1px solid #dfe5dc;border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.pk b{font-size:.9rem;font-weight:600}
.slotH{width:100%;margin:6px 0 2px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
body.paneOpen .dock{display:none}
body.paneOpen .title{visibility:hidden}
#sheet{position:fixed;right:14px;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px);max-width:560px;margin:0 auto}
#sheet[hidden]{display:none}
#sheet h4{margin:0 0 .15rem;font-size:1rem}
#sheet p{margin:0 0 .5rem;color:var(--muted);font-size:.84rem;line-height:1.5}
#sheet .opts{display:flex;flex-wrap:wrap;gap:6px}
#sheet .close{position:absolute;left:10px;top:8px;min-height:30px;padding:3px 10px}
body.sheetOpen .dock{display:none}
#sheet .hidebtn{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:400;font-size:.78rem;min-height:28px;padding:2px 10px}
#hiddenBtn,#resetPosBtn{background:var(--warnbg);color:var(--warn);border-color:var(--warn);pointer-events:auto;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
#resetPosBtn{background:var(--panel);color:var(--ink);border-color:var(--line)}
@media (max-width:560px){ .title p{display:none} .title h1{font-size:.95rem} button{padding:6px 10px;font-size:.8rem;min-height:34px} }
</style>
</head>

// Daily light estimate for the balcony: direct sun + sky diffuse + light through breeze blocks + interreflection (radiosity-lite).
// World: x = north (0 = south end), y = up, z = east (0 = west wall face, W = inner face of the east wall).
// Returns DLI (mol/m2/day, PAR) for given points, plus a floor-plane grid.
function lightModel(cfg){
  var rad=Math.PI/180, LAT=cfg.lat, LON=cfg.lon, LEN=cfg.LEN, W=cfg.W, T=cfg.T, H=cfg.H, SILL=cfg.SILL;
  var RHO=cfg.rho; // {floor, wall, ceil, glass, out}
  var P0=cfg.porosity, HOLE=cfg.holeRatio; // breeze: open fraction at normal incidence; depth/hole-size ratio for oblique cut-off
  // ---------- surfaces (rectangles), normal points into the balcony ----------
  var R=[];
  function rect(ax,c,a0,a1,b0,b1,n,rho,breeze){ R.push({ax:ax,c:c,a0:a0,a1:a1,b0:b0,b1:b1,n:n,rho:rho,br:!!breeze}); }
  // ax 'y': a=x, b=z ; ax 'z': a=x, b=y ; ax 'x': a=z, b=y
  rect('y',0,0,LEN,0,W,1,RHO.floor);
  rect('y',H,0,LEN,-cfg.recess.d,W+T,-1,RHO.ceil);
  var rc=cfg.recess;
  if(rc){
    rect('y',0,rc.x0,rc.x1,-rc.d,0,1,RHO.floor);
    rect('z',0,0,rc.x0,0,H,1,RHO.wall); rect('z',0,rc.x1,LEN,0,H,1,RHO.wall);
    rect('z',-rc.d,rc.x0,rc.x1,0,rc.door,1,RHO.glass); rect('z',-rc.d,rc.x0,rc.x1,rc.door,H,1,RHO.wall);
    rect('x',rc.x0,-rc.d,0,0,H,1,RHO.wall); rect('x',rc.x1,-rc.d,0,0,H,-1,RHO.wall);
  } else rect('z',0,0,LEN,0,H,1,RHO.wall);
  cfg.seg.forEach(function(sg,i){
    if(sg.t==='win'){ rect('z',W,sg.x0,sg.x1,0,SILL,-1,RHO.wall,true); rect('y',SILL,sg.x0,sg.x1,W,W+T,1,RHO.wall); }
    else {
      rect('z',W,sg.x0,sg.x1,0,H,-1,RHO.wall);
      if(i>0) rect('x',sg.x0,W,W+T,0,H,-1,RHO.wall);
      if(i<cfg.seg.length-1) rect('x',sg.x1,W,W+T,0,H,1,RHO.wall);
    }
  });
  var AX={x:0,y:1,z:2}, UA={y:0,z:0,x:2}, UB={y:2,z:1,x:1};
  R.forEach(function(r){ r.i=AX[r.ax]; r.ia=UA[r.ax]; r.ib=UB[r.ax]; });
  // ---------- patches ----------
  var PS=cfg.patch||30, PAT=[];
  R.forEach(function(r,ri){ var na=Math.max(1,Math.round((r.a1-r.a0)/PS)), nb=Math.max(1,Math.round((r.b1-r.b0)/PS)); r.na=na; r.nb=nb; r.p0=PAT.length;
    for(var j=0;j<nb;j++) for(var i=0;i<na;i++){ var p=[0,0,0]; p[r.i]=r.c; p[r.ia]=r.a0+(i+.5)*(r.a1-r.a0)/na; p[r.ib]=r.b0+(j+.5)*(r.b1-r.b0)/nb; var nv=[0,0,0]; nv[r.i]=r.n;
      PAT.push({p:p,n:nv,rho:r.rho*(r.br?(1-P0):1),r:ri}); } });
  // ---------- ray casting ----------
  function cast(o,d){ var best=1e12, hit=-1; for(var k=0;k<R.length;k++){ var r=R[k], dd=d[r.i]; if(dd===0) continue; var t=(r.c-o[r.i])/dd; if(t<=1e-4||t>=best) continue;
      var a=o[r.ia]+d[r.ia]*t, b=o[r.ib]+d[r.ib]*t; if(a<r.a0||a>r.a1||b<r.b0||b>r.b1) continue; best=t; hit=k; }
    if(hit<0) return null; var r=R[hit], t=best, a=o[r.ia]+d[r.ia]*t, b=o[r.ib]+d[r.ib]*t;
    var i=Math.min(r.na-1,Math.max(0,Math.floor((a-r.a0)/(r.a1-r.a0)*r.na))), j=Math.min(r.nb-1,Math.max(0,Math.floor((b-r.b0)/(r.b1-r.b0)*r.nb)));
    return {r:hit,patch:r.p0+j*r.na+i}; }
  function trans(d){ var c=Math.abs(d[2]); if(c<1e-6) return 0; var tn=Math.sqrt(Math.max(0,1-c*c))/c; return P0*Math.max(0,1-HOLE*tn); } // breeze transmission
  // outcome of a ray: list of [kind, weight, patch]: kind 0 sky, 1 ground (outside, below horizon), 2 patch
  function trace(o,d){ var h=cast(o,d); if(!h) return [[d[1]>0?0:1,1,-1]]; var r=R[h.r];
    if(r.br && d[2]>0){ var tr=trans(d); var out=[[2,1,h.patch]]; if(tr>0) out.push([d[1]>0?0:1,tr,-1]); return out; } // patch exitance already counts (1-P0); add what passes
    return [[2,1,h.patch]]; }

    function half(v){ return Math.round(v*2)/2; }
    function setPos(id,x,z){
      if(id.charAt(0)==='p'){ var i=+id.slice(1); x=clamp(half(x),0,LEN-PL_L); PLANTERS[i]=x; planterObjs[i].g.position.x=x; }
      else if(id.charAt(0)==='h'){ var j=+id.slice(1); x=clamp(half(x),POT_R,LEN-POT_R); HANG[j].x=x; ITEMS[id].obj.position.x=x-ORIG.h[j]; }
      else if(id==='cab'){ x=clamp(half(x),0,LEN-CAB.l); CAB.x0=x; L.cab.position.x=x-ORIG.cab; }
      else if(id==='ac'){ x=clamp(half(x),0,LEN-ACU.d); z=clamp(half(z),0,W-ACU.w); ACU.x0=x; ACU.z0=z; L.ac.position.set(x-ORIG.ac[0],0,z-ORIG.ac[1]); }
      else if(id==='woman'){ x=clamp(half(x),20,LEN-20); z=clamp(half(z),15,W-15); WOMAN.x=x; WOMAN.z=z; ITEMS.woman.obj.position.set(x,0,z); }
    }
    function moved(){ return PLANTERS.some(function(x,i){ return x!==ORIG.p[V][i]; }) || HANG.some(function(h,j){ return h.x!==ORIG.h[j]; }) ||
      CAB.x0!==ORIG.cab || ACU.x0!==ORIG.ac[0] || ACU.z0!==ORIG.ac[1] || WOMAN.x!==ORIG.woman[0] || WOMAN.z!==ORIG.woman[1]; }
    var resetBtn=document.getElementById('resetPosBtn');
    var LOCKED=false; try{ LOCKED=localStorage.getItem('danaBalconyLock')==='1'; }catch(e){}
    var lockBtn=document.getElementById('lockBtn');
    function setLock(on){ LOCKED=on; try{ localStorage.setItem('danaBalconyLock',on?'1':'0'); }catch(e){}
      if(lockBtn){ lockBtn.style.display=''; lockBtn.setAttribute('aria-pressed',on?'true':'false'); lockBtn.textContent=on?'🔒 מיקומים נעולים':'🔓 נעילת מיקומים'; }
      if(hintEl) hintEl.textContent=on?'המיקומים נעולים · גוררים כדי לסובב · נגיעה בפריט לפרטים':HINT;
      if(resetBtn) resetBtn.style.display=(moved()&&!on)?'':'none'; }
    if(lockBtn) lockBtn.addEventListener('click',function(){ setLock(!LOCKED); });
    setLock(LOCKED);
    function afterMove(){ rebuildDims(); if(typeof drawSVG==='function') drawSVG(); if(resetBtn) resetBtn.style.display=(moved()&&!LOCKED)?'':'none'; }
    function moveHint(id){ if(!hintEl) return; var p=getPos(id), nm=ITEMS[id]?ITEMS[id].name:'';
      var t=nm+' · '+Math.round(p.x)+' מהקצה הדרומי';
      if(id==='ac'||id==='woman') t+=' · '+Math.round(p.z)+' מהקיר המערבי';
      hintEl.textContent=t; }
    if(resetBtn) resetBtn.addEventListener('click',function(){
      PLANTERS.forEach(function(x,i){ setPos('p'+i,ORIG.p[V][i]); });
      HANG.forEach(function(h,j){ setPos('h'+j,ORIG.h[j]); });
      setPos('cab',ORIG.cab); setPos('ac',ORIG.ac[0],ORIG.ac[1]); setPos('woman',ORIG.woman[0],ORIG.woman[1]);
      afterMove(); });
    // capture phase on the stage: decide before the orbit controls see the press
    stage.addEventListener('pointerdown',function(e){
      if(e.button || LOCKED) return;
      var it=itemAt(e.clientX,e.clientY); if(!it) return;
      plane.setFromNormalAndCoplanarPoint(UPV,it.point);
      drag={id:it.id,start:it.point.clone(),p0:getPos(it.id),moved:false,sx:e.clientX,sy:e.clientY};
      controls.enabled=false;
    },true);
    window.addEventListener('pointermove',function(e){
      if(!drag) return;
      if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6) return;
      if(!drag.moved){ drag.moved=true; closeSheet(); }
      aim(e.clientX,e.clientY); if(!ray.ray.intersectPlane(plane,hitPt)) return;
      setPos(drag.id, drag.p0.x+(hitPt.x-drag.start.x), drag.p0.z+(hitPt.z-drag.start.z));
      moveHint(drag.id);
    });
    window.addEventListener('pointerup',function(){
      if(!drag) return; var d=drag; drag=null; controls.enabled=true;
      if(d.moved){ afterMove(); setTimeout(function(){ if(hintEl && !drag) hintEl.textContent=HINT; },1800); }
    });
    window.__dragTest={setPos:setPos,afterMove:afterMove,getPos:getPos,itemAt:itemAt}; // for checks
  }

  function resize(){ var w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<h ? 60 : 45; camera.updateProjectionMatrix(); }
  window.addEventListener('resize',resize); resize();
  (function loop(now){ requestAnimationFrame(loop); if(anim) anim(now); window.__cabStep(); controls.update(); renderer.render(scene,camera); })(performance.now());
})();
</script>
</body>
