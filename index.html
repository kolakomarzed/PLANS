<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLANS · תוכניות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#e9ecea; --ink:#1f2a24; --muted:#5b6a61; --card:#ffffff; --line:rgba(31,42,36,.14); --leaf:#2f6b3a; }
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#161d1b; --ink:#e7efe9; --muted:#9fb0a6; --card:#1f2724; --line:rgba(231,239,233,.16); --leaf:#6fbf7d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Arial Hebrew",Arial,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:40px 16px 60px}
h1{font-size:1.6rem;margin:0 0 .2rem;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:var(--leaf);outline:none}
.card b{display:block;font-size:1.05rem;font-weight:700}
.card span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>PLANS</h1>
  <p class="sub">תוכניות</p>
  <ul>
    <li><a class="card" href="dana-balcony-garden/"><b>גינת מרפסת דנה</b><span>מודל תלת־ממד, שרטוט ורשימת קנייה · 890 × 145</span></a></li>
    <li><a class="card" href="aya/"><b>גינת מרפסת איה</b><span>מודל תלת־ממד ואפשרויות אדניות · 320 × 170</span></a></li>
  </ul>
</main>
</body>
</html>
